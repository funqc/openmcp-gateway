# =============================================================================
# OpenMCP Gateway —— 后端服务注册配置
# =============================================================================
# 复制本文件为 services.yaml，按你的 NAS 服务填写。
# 启动时网关会逐个拉取 source 指向的 OpenAPI 文档、校验、解引用、建索引。
#
# 认证凭据【不要】写在这里——用 .env 的 AUTH_<ID>_SCHEME / AUTH_<ID>_VALUE。
# =============================================================================

services:
  # ---- 示例 1：文件服务（OpenAPI 暴露在 HTTP URL）----
  - id: files
    source: http://nas-1.local:5000/openapi.json
    # 可选：覆盖 spec 里的 baseUrl（spec 缺 server 字段、或想改写时用）
    # baseUrl: http://nas-1.local:5000
    # 可选：临时禁用某服务（缺省为 true）
    # enabled: false

  # ---- 示例 2：照片服务 ----
  - id: photos
    source: https://nas-2.local:8443/api/openapi.json

  # ---- 示例 3：下载服务（spec 是本地文件）----
  - id: downloads
    source: ./data/services/downloads-openapi.json
    baseUrl: http://nas-3.local:8080

  # ---- 示例 4：Unraid（GraphQL 服务）----
  # Unraid 只暴露 GraphQL 端点（没有 OpenAPI）。设 type: graphql 后，
  # 网关会对 source 指向的端点做 introspection，把每个 Query/Mutation
  # 根字段自动建成一个可检索的 operation（与 OpenAPI operation 同等对待）。
  # 凭据走 .env 的 AUTH_UNRAID_*（Unraid 用 x-api-key header）：
  #   AUTH_UNRAID_SCHEME=apikey
  #   AUTH_UNRAID_VALUE=<在 Unraid WebGUI Settings→Management Access→API Keys 生成>
  #   AUTH_UNRAID_HEADER=x-api-key
  - id: unraid
    type: graphql
    source: https://tower.local/graphql   # GraphQL 端点（introspection 从此发起）
    # baseUrl: https://tower.local         # 可选：默认从 source 去掉 /graphql 推断
